# Тест-пак Seedance у форматі лабораторії промптів (опис і критерії — series/la-garganta/test_pack.md).
# Кожен тест = стартовий кадр (image.start_frame) + відео (video.shot). Промпти збирає `fabrica prompts la-garganta test-pack`.
# people: id з bible.yaml; {id, state: wet} — «мокрий» варіант учасника сімки.

tests:
  - id: T1
    title: Левітація каміння на світанку (ч.1 · 4.03)
    frame:
      location: mina
      variant: dawn
      people: [vale, diego, sofia, mateo]
      framing: Wide
      composition: >-
        Four young adults lie and sit on the rocky ground in front of the mine entrance, dazed, small trickles of
        blood under their noses. Hundreds of small grey pebbles hang motionless in the air around them at different
        heights.
    videos:
      - id: video
        resolution: 720p
        duration_s: 8
        action: >-
          The hundreds of small pebbles floating in the air slowly drift and rotate in place, catching the warm sunrise
          light; fine dust glitters in the beams. The four young people stay still, only breathing; the young woman with
          the black ponytail slowly raises her head. Pebbles keep their exact shape and size, no merging, no new objects
          appear, gravity does not affect them.
        camera: slow steady push-in
        light: dawn, warm low sunrise light through mist
    success:
      - камінці не змінюють форму й кількість, обертаються повільно й безперервно
      - ДНК четвірки на місці (хвіст і чорна куртка; червона кепка й жовта вітровка; окуляри й бордовий кардиган; клітчаста фланель)
      - обличчя не «пливуть», камера рівна; ≥ 6 із 8 с придатні

  - id: T2
    title: Уламки скла в повітрі (ч.2 · 5)
    frame:
      location: cafe
      variant: glass
      people: [vale]
      framing: Medium-wide
      composition: >-
        The young woman stands in the center of the café, fists clenched at her sides (hands not in close-up),
        furious, a thin line of blood under her nose, her ponytail lifted slightly as if by static. Thousands of glass
        shards hang motionless in mid-air around her, sparkling.
    videos:
      - id: video
        resolution: 720p
        duration_s: 6
        action: >-
          Thousands of glass shards suspended in the air slowly rotate in place, refracting daylight into small rainbow
          glints. The young woman breathes heavily, staring ahead, motionless. Total silence. The shards stay sharp solid
          glass: no melting, no turning into liquid or smoke, they do not fall.
        camera: slow orbit around her by about 15 degrees
        light: warm daylight through the broken windows
    success:
      - уламки лишаються склом і не падають, відблиски правдоподібні
      - обличчя Vale стабільне під час обертання камери, шрам над бровою на місці
      - на вікнах і вивісках немає тексту

  - id: T3
    title: Меблі на стелі (ч.1 · 7.03)
    frame:
      location: casa_minero
      variant: ceiling
      people: [renata]
      framing: Wide, seen from the doorway
      composition: >-
        The policewoman stands in the doorway holding a flashlight, its beam on the wet footprints on the floor. Above
        her, all the furniture is stuck upside-down to the ceiling.
    videos:
      - id: video
        resolution: 720p
        duration_s: 8
        action: >-
          The policewoman slowly steps into the room. The view tilts up from the wet footprints to the ceiling,
          following her flashlight beam, revealing the furniture stuck to the ceiling. A little dust and a few drops of
          water fall down from the bed on the ceiling. The furniture creaks but stays firmly attached to the ceiling the
          whole time; nothing falls from the ceiling.
        camera: slow tilt up from the floor to the ceiling, following the flashlight beam
        light: cold flashlight beam, red-blue police lights flickering through the window
    success:
      - меблі весь кліп тримаються на стелі, не сповзають
      - пил і краплі падають униз (звичайна гравітація для них)
      - ДНК Renata (пучок із сивим пасмом, форма, медальйон); тілт плавний

  - id: T4
    title: VHS-скрімер у шахті (ч.1 · 1.06–1.07)
    frame:
      location: mina
      variant: tunnel
      people: []
      footage: vhs
      framing: Handheld point of view
      composition: >-
        Pitch-black narrow mine tunnel seen through the camcorder; a single flashlight beam on wet rock walls and old
        timber supports; dust in the beam. Nobody in the frame.
    videos:
      - id: buildup
        resolution: 480p
        duration_s: 6
        action: >-
          The flashlight beam slowly searches the dark tunnel, trembling slightly with the operator's breathing. Nothing
          moves. Water drips. The beam stops on a dark bend of the tunnel. Tense silence.
        camera: handheld point of view, slow searching pan
        light: a single handheld flashlight beam in total darkness
    extra_frames:
      - id: face
        location: mina
        variant: tunnel
        people: [{id: beto, state: wet}]
        footage: vhs
        framing: Extreme close-up, handheld
        composition: >-
          In the flashlight beam, a soaked pale young man's face with mine dust on it is right in front of the lens,
          eyes wide open, completely still, water dripping.
        videos:
          - id: video
            resolution: 480p
            duration_s: 2
            action: >-
              The face is suddenly right in front of the lens in the flashlight beam, completely still, eyes wide open,
              water dripping; the handheld camcorder jolts back.
            camera: handheld, a sharp jolt backwards
            light: a single cold flashlight beam
    success:
      - "наростання: напруга читається, промінь живий"
      - "обличчя: з'являється різко (≤ 0,5 с), ДНК Beto (стрижка, шрам на підборідді), без гору"
      - VHS-вигляд (шум, хроматика, дата) додаємо в монтажі — тест його не оцінює

  - id: T5
    title: Силуети на відео з телефону (ч.2 · 7–8)
    frame:
      location: mina
      people: [vale, diego, sofia, mateo]
      footage: phone
      framing: Wide
      composition: >-
        Four young adults walk out of the dark mine entrance towards the camera, lit only by their phone lights. Far
        behind them, in the darkness of the tunnel mouth, seven barely visible human silhouettes stand in a loose row.
    videos:
      - id: video
        resolution: 480p
        duration_s: 8
        action: >-
          The four young people walk out of the mine towards the camera, talking, unaware. Behind them, exactly seven
          dark human silhouettes silently follow at a distance, moving in unison. In the last two seconds the seven
          silhouettes stop and slowly turn their heads towards the camera, all at the same time.
        camera: handheld, a slow digital zoom in on the silhouettes
        light: night, only phone flashlights
    success:
      - силуетів рівно 7, рухаються синхронно
      - поворот голів одночасний і читається на 480p
      - четвірка не зливається із силуетами
