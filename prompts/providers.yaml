# Каталог маршрутів генерації: «<провайдер>:<модель>» → поля payload, правила, ціна, ручна поверхня.
# Читає fabrica/providers.py (load / validate / price / video_rates). Компілятори промптів беруть звідси маршрут
# і перевіряють кожен payload до відправки ("API: …" у попередженнях елемента).
# Значення — з docs/research/2026-10-07-generators.md (частина 4; виправлення частини 1 мають пріоритет).
# `verified` — звідки і коли взято схему; «UNVERIFIED: …» — форму не підтверджено: звір із живою схемою
# провайдера (Replicate `latest_version.openapi_schema`, каталог Cloudflare), перш ніж вмикати автоматику.
#
# Поле: type — string | uri | uri_list | string_list | int | number | bool | enum | const | object
#   values (enum) · value (const) · min / max (+ also — дозволені значення поза межами) · max_items
#   min_chars / max_chars · pattern (regex на весь рядок) · default (що візьме API, якщо поле не надіслано)
#   required (None / "" — помилка) · nullable (API приймає null; інакше None у payload — помилка: поле, яке не
#   надсилаємо, просто не кладемо) · in: body | query | path (де поле в HTTP-запиті; за замовчуванням body)
#   fields (для object)
#   avoid: «чому не надсилаємо» · policy + why (значення, яке свідомо тримаємо) · note (довідка людям)
# URI-поля приймають «ref:<id>» (файл підставить автоматика / людина), http(s)://…, data:… або локальний шлях.
# Правила (rules): frame_xor_reference, last_frame_needs_image, audio_needs_visual_ref, adaptive_with_frame,
#   match_input_needs_image, text_or_auto_text — див. RULES у fabrica/providers.py.
# Ціна (price): unit second | image | 1k_chars; by (поле) + values, або rate; video_input — ставки з reference_videos.
#   Для enum-поля by ставка потрібна на кожне його значення (нова роздільність без ціни — помилка каталогу).
# hints: «поле» — підказка до невідомого поля верхнього рівня будь-якого маршруту; «об'єкт.поле» — вкладеного.
# generation: профіль довжини кліпу (providers.generation(); env GENERATION_PROFILE перемикає) — clip_s
#   (фіксовані довжини, с) або clip_min_s + clip_max_s; resolution або resolution_by_tier; surface / url / note.
# УВАГА YAML: співвідношення сторін («16:9») і on/off — лише в лапках, інакше YAML зробить із них число / bool.

version: 1

generation:
  # Рішення людини 2026-10-07: відео в лабораторії тестуємо на ОДНОМУ платному акаунті (ліміт «перших 30 с» — $40),
  # тими самими моделлю й параметрами, що й автоматика: Seedance 2.5, 720p, кліп = довжина шоту (4–10 с).
  profile: lab-2.5              # активний профіль (GENERATION_PROFILE у .env його перевизначає)
  profiles:
    lab-2.5: {clip_min_s: 4, clip_max_s: 10, resolution: "720p", surface: "dropshot AI Studio (Seedance 2.5)",
              url: "https://aistudio.dropshot.io",
              note: "платний акаунт; тривалість = duration картки (немає в списку — найближча більша, у монтаж — вікно)"}
    manual-5s: {clip_s: [5], resolution: "720p", surface: "dropshot AI Studio (Seedance 2.5)",
                url: "https://aistudio.dropshot.io", note: "1 генерація 720p × 5 с на акаунт (безкоштовні акаунти)"}
    # автоматика: ті самі модель і роздільність, що в лабораторії; шот ≤ 10 с → один кліп
    replicate-2.5: {clip_min_s: 4, clip_max_s: 10, resolution: "720p"}

hints:      # підказка до «невідомого поля» (див. шапку)
  negative_prompt: "у Seedance і Nano Banana немає negative — опиши бажане позитивно в промпті"
  negative: "у Seedance і Nano Banana немає negative — опиши бажане позитивно в промпті"
  use_virtual_avatar: "є лише на маршруті cloudflare:bytedance/seedance-2.5"
  fps: "Seedance завжди дає 24 к/с; поле не надсилаємо"
  camera_fixed: "замка камери в API немає — пиши «Static locked-off camera on a tripod» у промпті"
  last_image: "поле називається last_frame_image"
  draft: "draft є лише на ModelArk; на Replicate і Cloudflare його немає"
  voice_settings.style: "eleven_v4 приймає у voice_settings лише stability і similarity_boost"
  voice_settings.speed: "eleven_v4 приймає у voice_settings лише stability і similarity_boost"
  voice_settings.use_speaker_boost: "eleven_v4 приймає у voice_settings лише stability і similarity_boost"
  thinking_level: "UNVERIFIED: на Replicate поля thinking_level не знайдено (є на fal)"
  num_outputs: "один виклик — одне зображення"

routes:

  # ------------------------------------------------------------------ відео: Seedance

  replicate:bytedance/seedance-2.5:
    provider: replicate
    model: bytedance/seedance-2.5
    kind: video
    verified: >-
      2026-10-05 схема Replicate, версія a10a543d…813f (genfeed [GFV], cortex [RS25]); ліміт промпту 2000 —
      польові звіти [LV][NICK] і maxLength Cloudflare; ціни [GFV] = [CFDOC25].
      docs/research/2026-10-07-generators.md §1.3, §1.4, §1.5
    prompt_field: prompt
    prompt_max_chars: 2000
    fields:
      prompt: {type: string, default: "", note: "необов'язковий, якщо є медіа; діалог — у подвійних лапках"}
      image: {type: uri, nullable: true, note: "перший кадр; не поєднується з reference_*"}
      last_frame_image: {type: uri, nullable: true, note: "лише разом з image; те саме співвідношення сторін"}
      reference_images: {type: uri_list, max_items: 30, default: [], note: "у промпті — [Image1], [Image2]…"}
      reference_videos: {type: uri_list, max_items: 10, default: [], note: "разом ≤30 с; тариф «з відео» (×4,2)"}
      reference_audios: {type: uri_list, max_items: 10, default: [], note: "разом ≤30 с; потрібне фото чи відео"}
      duration: {type: int, min: 4, max: 30, also: [-1], default: 5, note: "-1 — лише edit / extend (оплата до 30 с)"}
      resolution: {type: enum, values: ["480p", "720p"], default: "720p"}
      aspect_ratio: {type: enum, values: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "adaptive"], default: "16:9"}
      generate_audio: {type: bool, default: true}
      watermark: {type: bool, default: false}
      output_format: {type: enum, values: ["mp4", "mov"], default: "mp4"}
      seed: {type: int, nullable: true, note: "відтворюваність не гарантовано"}
    rules: [frame_xor_reference, last_frame_needs_image, audio_needs_visual_ref, adaptive_with_frame]
    price: {unit: second, by: resolution, values: {"480p": 0.1028, "720p": 0.2312},
            video_input: {"480p": 0.4304, "720p": 0.9676}}
    manual:
      surface: "Replicate playground"
      url: "https://replicate.com/bytedance/seedance-2.5"
      endpoint: "POST https://api.replicate.com/v1/models/bytedance/seedance-2.5/predictions — тіло {\"input\": <payload>}"
      how: >-
        Відкрий сторінку моделі → Playground, перемкни форму на JSON і встав payload без змін (сід, тривалість,
        роздільність, aspect_ratio — рівно як є). Кожне «ref:<id>» — файл із лабораторії: завантаж його в те саме
        поле (image — стартовий кадр, last_frame_image — кінцевий, reference_images — у порядку слотів [Image1],
        [Image2]…). Обличчя крупно Replicate відхиляє (E005) — такі шоти йдуть на маршрут Cloudflare. Run; результат
        живе 1 год — одразу скачай і запиши в журнал (`fabrica lab log`).

  cloudflare:bytedance/seedance-2.5:
    provider: cloudflare
    model: bytedance/seedance-2.5
    kind: video
    verified: >-
      2026-08-07 офіційний каталог Cloudflare [CFDOC25] (additionalProperties:false, maxLength 2000, aspect за
      замовчуванням adaptive, аудіо-референси без фото дозволені); use_virtual_avatar з обличчям пройшов польовий тест
      2026-10-07 [VSB-S]. UNVERIFIED: REST-шлях із Python (офіційно — Worker env.AI.run).
      docs/research/2026-10-07-generators.md §1.3, частина 3 п.1, C1, C14
    prompt_field: prompt
    prompt_max_chars: 2000
    fields:
      prompt: {type: string, default: ""}
      image: {type: uri, note: "з use_virtual_avatar задає лише обличчя, не композицію першого кадру"}
      last_frame_image: {type: uri}
      reference_images: {type: uri_list, max_items: 30, default: []}
      reference_videos: {type: uri_list, max_items: 10, default: []}
      reference_audios: {type: uri_list, max_items: 10, default: [], note: "можна без фото / відео (на відміну від Replicate)"}
      duration: {type: int, min: 4, max: 30, also: [-1], default: 5}
      resolution: {type: enum, values: ["480p", "720p"], default: "720p"}
      aspect_ratio: {type: enum, values: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "adaptive"], default: "adaptive"}
      generate_audio: {type: bool, default: true}
      watermark: {type: bool, default: false}
      output_format: {type: enum, values: ["mp4", "mov"], default: "mp4"}
      seed: {type: int}
      use_virtual_avatar: {type: bool, default: false,
                           note: "true — лише для AI-персонажів, на які маємо права (пропускає обличчя через бібліотеку аватарів)"}
      fps: {type: const, value: 24, avoid: "Seedance завжди дає 24 к/с"}
      camera_fixed: {type: bool, avoid: "у Cloudflare «has no effect» — пиши «Static locked-off camera on a tripod» у промпті"}
    rules: [frame_xor_reference, last_frame_needs_image, adaptive_with_frame]
    price: {unit: second, by: resolution, values: {"480p": 0.1028, "720p": 0.2312},
            video_input: {"480p": 0.4304, "720p": 0.9676}}
    manual:
      surface: "Cloudflare Workers AI (curl)"
      url: "https://github.com/cloudflare/cloudflare-docs/blob/production/src/content/catalog-models/bytedance-seedance-2.5.json"
      endpoint: "POST https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/bytedance/seedance-2.5 (UNVERIFIED: REST-шлях)"
      how: >-
        Плейграунда для відео не підтверджено — запускай curl. Ключі лише з оточення: CLOUDFLARE_ACCOUNT_ID і
        CLOUDFLARE_API_TOKEN (у файли не вписуй). Збережи payload у payload.json (UTF-8 без BOM — не через `>` у
        PowerShell 5.1), кожне «ref:<id>» заміни на публічний https-URL файлу (R2 тощо; base64 — UNVERIFIED).
        macOS / zsh:

          curl -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/bytedance/seedance-2.5" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary "@payload.json"

        Windows / PowerShell — саме curl.exe, а "@payload.json" лише в лапках (без них @ — оператор PowerShell):

          curl.exe -X POST "https://api.cloudflare.com/client/v4/accounts/$env:CLOUDFLARE_ACCOUNT_ID/ai/run/bytedance/seedance-2.5" -H "Authorization: Bearer $env:CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary "@payload.json"

        Відповідь — {"video": url} (у REST, імовірно, всередині {"result": …}). UNVERIFIED: REST-шлях; якщо не
        працює — Worker: env.AI.run('bytedance/seedance-2.5', payload). use_virtual_avatar:true — лише для
        AI-персонажів; стартовий кадр тоді задає обличчя, а не композицію, тож розстановку тримає текст промпту.

  replicate:bytedance/seedance-2.0:
    provider: replicate
    model: bytedance/seedance-2.0
    kind: video
    verified: >-
      2026-10-05 схема Replicate [GFV] (4k у resolution з 2026-09; знімок 2026-06-05 [RS20] — prompt maxLength 4000);
      ціни Replicate [GFV]. UNVERIFIED: image + reference_audios разом.
      docs/research/2026-10-07-generators.md §1.3, §1.5, C13
    prompt_field: prompt
    prompt_max_chars: 4000
    fields:
      prompt: {type: string, required: true, note: "BytePlus радить ≤600 англійських слів; 2.0 — мітки шотів, не секунди"}
      image: {type: uri}
      last_frame_image: {type: uri}
      reference_images: {type: uri_list, max_items: 9, default: []}
      reference_videos: {type: uri_list, max_items: 3, default: [], note: "разом ≤15 с"}
      reference_audios: {type: uri_list, max_items: 3, default: [], note: "разом ≤15 с"}
      duration: {type: int, min: 4, max: 15, also: [-1], default: 5}
      resolution: {type: enum, values: ["480p", "720p", "1080p", "4k"], default: "720p", note: "4k — 10-біт H.265"}
      aspect_ratio: {type: enum, values: ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9", "9:21", "adaptive"], default: "16:9"}
      generate_audio: {type: bool, default: true}
      seed: {type: int, nullable: true}
    rules: [frame_xor_reference, last_frame_needs_image, audio_needs_visual_ref, adaptive_with_frame]
    price: {unit: second, by: resolution, values: {"480p": 0.08, "720p": 0.18, "1080p": 0.45, "4k": 1.00},
            video_input: {"480p": 0.10, "720p": 0.22, "1080p": 0.55, "4k": 1.25}}
    manual:
      surface: "Replicate playground"
      url: "https://replicate.com/bytedance/seedance-2.0"
      endpoint: "POST https://api.replicate.com/v1/models/bytedance/seedance-2.0/predictions — тіло {\"input\": <payload>}"
      how: >-
        Відкрий сторінку моделі → Playground, перемкни на JSON і встав payload без змін. «ref:<id>» — файли з
        лабораторії: завантаж у те саме поле в порядку слотів ([Image1]…). Це інша граматика, ніж 2.5: промпт 2.5
        сюди не переносимо. Обличчя крупно відхиляються (E005). Результат живе 1 год — скачай і запиши в журнал.

  # ------------------------------------------------------------------ зображення: Nano Banana

  replicate:google/nano-banana-pro:
    provider: replicate
    model: google/nano-banana-pro
    kind: image
    verified: >-
      2026-03-06 схема Replicate [L1], звірено з каталогом Puter 2026-10-07 [PUTER] і treg 2026-09-14 [TREGNB];
      seed / negative немає; ціни 2026-10-06 [GFR]. docs/research/2026-10-07-generators.md §1.7
    prompt_field: prompt
    prompt_max_chars: null
    fields:
      prompt: {type: string, required: true}
      image_input: {type: uri_list, max_items: 14, default: [], note: "порядок = Image 1, Image 2…; 6 — висока точність"}
      aspect_ratio: {type: enum, default: "match_input_image",
                     values: ["match_input_image", "1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]}
      resolution: {type: enum, values: ["1K", "2K", "4K"], default: "2K"}
      output_format: {type: enum, values: ["jpg", "png"], default: "jpg"}
      safety_filter_level: {type: enum, values: ["block_low_and_above", "block_medium_and_above", "block_only_high"],
                            default: "block_only_high"}
      allow_fallback_model: {type: bool, default: false, policy: false,
                             why: "інакше під навантаженням картинку мовчки зробить bytedance/seedream-5 — чужа ідентичність"}
    rules: [match_input_needs_image]
    price: {unit: image, by: resolution, values: {"1K": 0.15, "2K": 0.15, "4K": 0.30}}
    manual:
      surface: "Replicate playground"
      url: "https://replicate.com/google/nano-banana-pro"
      endpoint: "POST https://api.replicate.com/v1/models/google/nano-banana-pro/predictions — тіло {\"input\": <payload>}"
      how: >-
        Відкрий сторінку моделі → Playground. Встав prompt і решту полів payload без змін. image_input: завантаж
        файли «ref:<id>» строго в порядку списку — перший = Image 1 (локація), далі люди. Сіда немає: кожен запуск
        інший, тож роби 2–3 спроби й логуй найкращу. allow_fallback_model лиши false. Для довгих запитів можна AI
        Studio з тією ж моделлю, але еталон — Replicate.

  replicate:google/nano-banana-2.1:
    provider: replicate
    model: google/nano-banana-2.1
    kind: image
    verified: >-
      UNVERIFIED: форму полів екстрапольовано зі схеми Nano Banana 2 [L1][PUTER] — знімка схеми 2.1 немає (C8);
      модель є на Replicate, ціни 2026-10-06 [GFR], «active» 2026-10-07 [MPEDIA]. Звір поля перед автоматикою.
      docs/research/2026-10-07-generators.md §1.7, C8
    prompt_field: prompt
    prompt_max_chars: null
    fields:
      prompt: {type: string, required: true}
      image_input: {type: uri_list, max_items: 14, default: [], note: "≤4 персонажі + ≤10 об'єктів (UNVERIFIED)"}
      aspect_ratio: {type: enum, default: "match_input_image",
                     values: ["match_input_image", "1:1", "1:4", "1:8", "2:3", "3:2", "3:4", "4:1", "4:3", "4:5", "5:4",
                              "8:1", "9:16", "16:9", "21:9"]}
      resolution: {type: enum, values: ["1K", "2K", "4K"], default: "1K"}
      google_search: {type: bool, default: false, policy: false, why: "пошук Google тягне чужі факти в кадр"}
      image_search: {type: bool, default: false, policy: false, why: "пошук картинок може затягти чужі обличчя в ідентичність"}
      output_format: {type: enum, values: ["jpg", "png"], default: "jpg"}
    rules: [match_input_needs_image]
    price: {unit: image, by: resolution, values: {"1K": 0.0336, "2K": 0.0504, "4K": 0.1134}}
    manual:
      surface: "Replicate playground"
      url: "https://replicate.com/google/nano-banana-2.1"
      endpoint: "POST https://api.replicate.com/v1/models/google/nano-banana-2.1/predictions — тіло {\"input\": <payload>}"
      how: >-
        Відкрий сторінку моделі → Playground. Спершу звір, що поля форми збігаються з payload (схема 2.1 —
        UNVERIFIED; якщо поля нема чи воно інакше зветься — напиши в журнал). Встав prompt і поля без змін;
        image_input — файли «ref:<id>» строго в порядку списку (Image 1, Image 2…). google_search і image_search
        лиши вимкненими. Сіда немає — 2–3 спроби, логуй найкращу.

  # ------------------------------------------------------------------ голос: ElevenLabs

  elevenlabs:eleven_v4:
    provider: elevenlabs
    model: eleven_v4
    kind: voice
    verified: >-
      ElevenLabs API text-to-speech (дзеркала 2026-10) [EL-API]; v4 приймає лише stability і similarity_boost
      [EL-SKILL 2026-10-05][EL-WHATV4]; ліміт 10 000 символів [EL-MODELS]; склейка через previous_request_ids
      [EL-STITCH 2026-10-06]. UNVERIFIED: ціна за 1K символів (C18) і повний перелік output_format.
      docs/research/2026-10-07-generators.md §1.8, §5.2, §5.4
    prompt_field: text
    prompt_max_chars: 10000
    fields:
      voice_id: {type: string, in: path, min_chars: 1, note: "з bible.yaml → voice.voice_id; підставляє автоматика"}
      output_format: {type: enum, in: query, default: "mp3_44100_128", note: "mp3_44100_192 — від тарифу Creator; wav/pcm 44.1 — Pro",
                      values: ["mp3_22050_32", "mp3_44100_32", "mp3_44100_64", "mp3_44100_96", "mp3_44100_128",
                               "mp3_44100_192", "pcm_16000", "pcm_22050", "pcm_24000", "pcm_44100", "wav_44100"]}
      text: {type: string, required: true, note: "теги англійською в [дужках], репліка — мексиканською іспанською"}
      model_id: {type: const, value: "eleven_v4", required: true, note: "API за замовчуванням бере multilingual_v2 — завжди явно"}
      language_code: {type: string, pattern: "[a-z]{2}", note: "ISO 639-1; для серії — es"}
      voice_settings:
        type: object
        fields:
          stability: {type: number, min: 0, max: 1, default: 0.5}
          similarity_boost: {type: number, min: 0, max: 1, default: 0.75}
      seed: {type: int, min: 0, max: 4294967295}
      previous_text: {type: string}
      next_text: {type: string}
      previous_request_ids: {type: string_list, max_items: 3, note: "з ним previous_text ігнорується"}
      next_request_ids: {type: string_list, max_items: 3}
