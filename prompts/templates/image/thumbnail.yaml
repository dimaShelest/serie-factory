id: image.thumbnail
kind: image
version: 2
profile: nano-banana
route: replicate:google/nano-banana-pro
description: Обкладинка частини (YouTube 16:9) або тизера (9:16) — без тексту, назву накладаємо в монтажі. Компілятора ще немає.
payload:
  aspect_ratio: "16:9"
  resolution: "2K"
  output_format: png
  allow_fallback_model: false
prompt: |-
  {% if refs %}Image 1 is the location; the next images are the people — use them only for each person's face, hair, build and clothing. {% endif %}
  High-impact cover image: {{ composition }} Strong silhouette, one clear focal point, dramatic contrast, an empty area on
  the {{ text_side }} third for a title added later. {{ style.image }} {{ rules | join("; ") | capfirst }}.
