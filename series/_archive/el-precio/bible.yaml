title: "El Precio"
status: archived         # 2026-10-05: замінено на LA GARGANTA (див. docs/DECISIONS.md)

# ---------------------------------------------------------------- а) концепція
concept:
  chosen: El Precio
  premise_short: >-
    Героїня з бідного світу — прихований спадкоємець багатої родини. Хтось платить
    (і платив) ціну за те, щоб ця таємниця не вийшла назовні.
  logline: null          # фіксуємо після питань а2 (хто героїня, що за «ціна», як вона входить у світ родини)
  genre: [мелодрама, детектив]
  tone: >-
    Пристрасті й сльози теленовели плюс таємниця, яку глядач розплутує з серії в серію.
    Драматична іронія: глядач знає (або здогадується) більше, ніж героїня.
  priorities: [сила хуків, оригінальність]   # чим керуємось, коли варіанти близькі
  evaluation:            # 1–5, оцінки погоджено з людиною 2026-10-05
    criteria: [сила хуків, дешевизна генерації, оригінальність, вистачить на сезон]
    El Precio:    {hooks: 4, cost: 3, originality: 3, capacity: 4, total: 14}
    La Herencia:  {hooks: 5, cost: 3, originality: 2, capacity: 5, total: 15}
    La Otra Vida: {hooks: 4, cost: 5, originality: 2, capacity: 3, total: 14}
  why_chosen: >-
    Найоригінальніша з трьох і з сильною драматичною іронією, яка дає хуки.
    Детективна лінія додає двигун на кілька мінісезонів.

# ---------------------------------------------------------------- формат
format:
  unit: parte                    # частина = епізод
  parts_per_season: 4            # мінісезон
  part_minutes: [5, 7.5]
  season_minutes: [20, 30]
  continuation: >-
    Наступні мінісезони — лише для історій, що «залітають» (перегляди, утримання,
    запити глядачів у коментарях). Кожен мінісезон закінчується так, щоб його можна було
    як продовжити, так і залишити.
  episode_video: {aspect: "16:9", platform: YouTube}
  teaser_video: {aspect: "9:16", seconds: [30, 40], platforms: [TikTok, YouTube Shorts], ends_on: hook}

