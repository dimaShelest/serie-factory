# Маніфест референсів LA GARGANTA — зона A. Самі файли лежать у R2 (у Git їх немає), тут лише опис.
# Заповнюємо після кастингу (docs/casting/la-garganta.md). Поки що це ПРИКЛАД: усі записи status: example.
#
# Поля:
#   id          — <owner>.<view>[.<variant>], унікальний; на нього посилаються етапи refs / video / qc
#   owner       — id з bible.yaml: персонаж (characters / supporting.los_siete.members), локація або prop:<назва>
#   kind        — character | location | prop
#   view        — base | three_quarter | profile | full_body | emotion | plate
#   variant     — null або стан: wet, 1994, young, dawn, tunnel, flooded, collapse, ceiling, 3_17, glass…
#   status      — example → candidate → approved → retired. Генерація відео бере лише approved.
#   file        — ключ у R2 (r2://<bucket>/<шлях>); локальна копія — output/refs/la-garganta/<той самий шлях>
#   sha256      — хеш файлу (контроль, що в R2 саме затверджений файл)
#   derived_from — id ref, з яким цей генерували як з референсом (лист персонажа, мокрий варіант, Tomás ← Mateo)
#   generator   — інструмент, модель, seed; prompt — дослівно, як надіслали
#   approved_by / approved_at — людина й дата затвердження

