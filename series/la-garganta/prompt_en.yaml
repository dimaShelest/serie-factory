# Англійський шар біблії LA GARGANTA — те, що потрапляє в промпти (image / video / voice).
# Зона A. id ті самі, що в bible.yaml; кількість ознак ДНК — та сама, що в bible.yaml (перевіряє tests/test_prompts.py).
# Змінюєш тут → перегенеруй пакет (`uv run fabrica prompts la-garganta <набір>`): версія промпту зміниться.

style:
  photo: >-
    Photorealistic cinematic still, shot on 35mm film, natural skin texture with visible pores, soft directional key
    light, muted desaturated palette with deep teal shadows and warm practical highlights, shallow depth of field,
    Mexican gothic horror film aesthetic.
  video: >-
    Photorealistic, cinematic, 35mm film look, muted desaturated palette with deep teal shadows and warm practical
    highlights, natural motion, Mexican gothic horror atmosphere.
  portrait: >-
    Head-and-shoulders portrait, front-facing, eyes to camera, neutral dark grey studio background, soft even light.
  sheet_background: Plain light-grey studio background, soft even light
  era_1994: >-
    Candid 35mm film snapshot from 1994, visible film grain, warm faded colors, slight on-camera flash look.
  footage:
    vhs: 1994 VHS camcorder footage, handheld, low resolution, slight video noise, no on-screen text or date stamp.
    phone: Low-light smartphone video, handheld, grainy, slight digital noise, realistic phone footage.
  original: Original character, not resembling any real person or celebrity.

# Правила під Seedance / Nano Banana — додаються в кожен промпт кадру.
rules:
  - no text, letters, numbers, signs or logos anywhere in the frame
  - hands are never in close-up and stay natural with five fingers
  - no fights, no crowds in motion
  - no gore, no wounds, no blood except a thin trickle from the nose
  - every person is an adult (18+)

negative:
  common: [text, letters, numbers, subtitles, watermark, logo, signage, extra fingers, deformed hands, hand close-up,
           gore, wounds, blood pool, child, minor, cartoon, anime, 3d render, plastic skin, oversaturated colors]
  video: [morphing, flicker, jitter, face distortion, sudden scene change, camera shake (unless handheld)]

characters:
  vale:
    who: a 19-year-old Mexican young woman (adult)
    dna:
      - black straight hair pulled into a high messy ponytail with loose strands
      - warm olive-brown skin, thick straight dark eyebrows
      - a small thin scar above her left eyebrow
      - an oversized black denim jacket with frayed, worn sleeves
    wardrobe: oversized black denim jacket over a plain grey t-shirt, dark jeans, worn boots
    expression: guarded and defiant, slight frown
    emotions:
      - "barely contained rage, jaw clenched, a thin line of blood under her nose"
      - "raw terror, eyes wide, frozen"
      - "quiet determination, chin up"
    voice: low, husky young female voice; fast and sharp when angry; Mexican Spanish accent
    preview_es: "No me digas que me calme. Ya sé lo que vi en esa mina, y no estoy loca. Si nadie más va a buscar la verdad, la voy a buscar yo."
  diego:
    who: a 19-year-old Mexican young man (adult)
    dna:
      - a red baseball cap worn backwards
      - curly chestnut-brown hair poking out from under the cap
      - a bright yellow windbreaker jacket
      - a smartphone always in his hand (seen in medium shots, never a hand close-up)
    wardrobe: bright yellow windbreaker, black pants, white sneakers
    expression: big mischievous grin, round friendly face, light brown skin
    emotions:
      - "laughing out loud, eyes squeezed"
      - "screaming in pure terror"
      - "awe, mouth open, looking up"
    voice: bright, fast young male voice with a smile in it, cracks into a shout; Mexican Spanish accent
    preview_es: "¡No manches! ¿Estás grabando esto? Esto va directo a mis historias… bueno, ya, ya me calmo, pero neta, mira eso."
  sofia:
    who: an 18-year-old Mexican young woman (adult)
    dna:
      - round thin metal-frame glasses
      - long dark hair in a single braid over her right shoulder
      - a burgundy knitted cardigan
      - a canvas tote bag strap across her chest
    wardrobe: burgundy knitted cardigan over a white collared blouse, long skirt or jeans
    expression: focused, analytical, slightly skeptical, light brown skin
    emotions:
      - "deep concentration, eyes lowered as if reading"
      - "shock, eyes wide, lips parted"
      - "quiet sorrow, eyes wet"
    voice: clear, even, measured young female voice that speeds up with excitement; Mexican Spanish accent
    preview_es: "Esto no es una coincidencia. Siete nombres, una sola noche, y la misma hora en todos los relojes del pueblo. Alguien sabe qué pasó."
  mateo:
    who: an 18-year-old Mexican young man (adult)
    dna:
      - short dark hair parted in the middle in a 1990s style, always slightly damp
      - very pale skin with a faint grey undertone, dark circles under his eyes
      - a blue-grey plaid flannel shirt worn open over a plain white t-shirt
    wardrobe: the same blue-grey plaid flannel over a white t-shirt in every scene
    expression: calm, quiet, unreadable, slightly melancholic; he must look like a real living person, not a ghost
    emotions:
      - "perfect stillness, looking slightly past the camera"
      - "deep sadness"
      - "a faint, unsettling half-smile"
    voice: quiet, even, slightly husky young male voice, pauses before answering; Mexican Spanish accent
    preview_es: "Yo me sé el camino. No tengan miedo, la montaña no muerde… casi nunca. Vamos, antes de que se haga más tarde."
  renata:
    who: a 44-year-old Mexican woman, small-town police officer
    dna:
      - dark hair in a tight low bun with a single grey streak at her left temple
      - a navy-blue municipal police uniform shirt
      - a deep vertical frown line between her brows, tired but sharp eyes
      - a small old silver oval locket on a thin chain at her neck
    wardrobe: navy-blue municipal police uniform; off duty a dark jacket, the same locket
    expression: stern, controlled, tan skin
    emotions:
      - "cold professional authority"
      - "grief breaking through, eyes wet, lips trembling"
      - "hard resolve"
    voice: low, dry, restrained female voice in her forties; Mexican Spanish accent
    preview_es: "No toquen nada. Llevo treinta y dos años esperando una respuesta, y esta vez nadie me va a decir que fue un accidente."
  saldivar:
    who: a 62-year-old Mexican man, beloved small-town mayor
    dna:
      - thick grey hair combed back and a full grey mustache
      - a light straw texana cowboy hat
      - a massive silver ring with a black stone on his right ring finger
      - a light cream guayabera shirt
    wardrobe: cream guayabera, straw texana, polished boots, never dirty
    expression: warm, fatherly public smile; warm tanned weathered skin
    emotions:
      - "warm public smile"
      - "cold quiet menace, smile gone"
      - "sudden fear, color drained from his face"
    voice: warm, velvety, fatherly male voice in his sixties with steel underneath; Mexican Spanish accent
    preview_es: "Renata, mija, deja descansar a los muertos. Este pueblo ya sufrió bastante, y yo nomás quiero que vuelva a tener trabajo."

# Сімка 1994 (supporting.los_siete.members). Обличчя Tomás = Mateo.
members:
  tomas: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "same face as the Mateo reference, alive and healthy: natural warm skin tone, middle-parted hair, blue-grey plaid flannel shirt over the school uniform, smiling at a friend off camera"}
  lupita: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "curly dark hair with 90s bangs, large round hoop earrings, laughing, lively"}
  chuy: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "thick-framed glasses, thin teenage mustache, holding a generic 1990s VHS camcorder on his shoulder (no brand logos)"}
  monica: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "tall, straight hair held back with a headband, dark 90s lipstick, confident"}
  beto: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "buzz-cut hair, broad shoulders, a small scar on his chin, grinning"}
  rosa_elena: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "two dark braids, a small gold cross on a chain, shy gentle smile"}
  ivan: {who: an 18-year-old Mexican prepa graduate in 1994 (adult), look: "shoulder-length grunge hair, denim jacket over the school uniform, relaxed"}

uniform_1994: white button-up shirt, navy V-neck sweater or vest, dark trousers or pleated navy skirt, early-1990s hairstyle
wet_ghost: >-
  soaked, hair dripping, skin pale with a grey-blue tint, fine mine dust on the face, eyes normal (not monstrous),
  quiet and sad expression, very dark background lit by a single cold flashlight beam. No gore, no wounds, no blood.

locations:
  # Стан (variant): рядок або {desc, light, mood, replace}. replace: true — інше приміщення чи ракурс (база не
  # додається); без replace — стан того самого місця (база + стан).
  mina:
    base: >-
      the entrance (bocamina) of an abandoned silver mine cut into a steep rocky mountainside above a small Mexican
      colonial mining town; old wooden support beams, rusted rail tracks leading into darkness, a rusty open gate
    light: night, cold moonlight, distant warm town lights far below
    mood: oppressive darkness, the mountain hums, water drips
    variants:
      dawn:
        desc: the same entrance at dawn, low mist, small pebbles scattered on the ground
        light: dawn, pale golden sunrise light through low mist
        mood: eerie stillness after a night nobody remembers
      tunnel:
        replace: true
        desc: a narrow abandoned silver-mine tunnel with wet rough rock walls, old timber supports and rusted rail tracks
        light: total darkness except handheld flashlight beams cutting through floating dust
        mood: claustrophobic, the mountain hums, water drips
      flooded:
        replace: true
        desc: the lower flooded tunnel of the mine with knee-deep still black water, a dripping rock ceiling and old timber supports
        light: darkness, flashlight beams reflecting on the black water
        mood: cold, still, something waits under the water
      collapse:
        replace: true
        desc: a mine tunnel blocked by a wall of fallen boulders
        light: darkness, flashlight beams through hanging dust
        mood: trapped, the mountain settles
  plaza_reloj:
    base: >-
      a small Mexican colonial mining-town plaza: cobblestones, colorful facades with dark windows, a parish church,
      a stone clock tower with a large white analog clock face with simple bar markers and no numerals, an old 1980s
      sedan parked (no brand logos)
    light: night, warm yellow streetlights
    mood: a sleepy town holding its breath
    variants:
      street:
        replace: true
        desc: a narrow cobblestone street with colorful colonial facades leading to the town plaza
        light: night, warm yellow streetlights
      clock_317: >-
        close view of the clock face; the hour hand and the minute hand both point almost exactly at the 3 o'clock
        position, nearly overlapping (time 3:17)
  casa_minero:
    base: >-
      a humble old miner's one-room house: whitewashed adobe walls, a single metal bed, wooden table and chairs, an oil
      lamp, a crucifix, a framed old group photograph on the wall
    light: night, cold flashlight light, red-blue police lights flickering through the small window
    mood: wrongness, silence
    variants:
      exterior:
        replace: true
        desc: >-
          the outside of an old miner's whitewashed adobe house on a dirt street, a police pickup with flashing lights
          parked in front (no markings, no text), no crowd
        light: night, flashing red and blue police lights
      patrol_car:
        replace: true
        desc: the inside of a parked municipal patrol car on a dirt street, dark dashboard, the mountain visible through the windshield
        light: night, faint dashboard glow and distant police lights
      ceiling: >-
        all the furniture — bed, table, chairs, lamp — is stuck upside-down to the ceiling, defying gravity; wet bare
        footprints on the dusty floor lead from the door to where the bed used to stand; water drips from the bed on
        the ceiling
  casa_vale:
    base: a small cramped bathroom in a modest Mexican house, an old mirror with worn silvering above a white sink, tiled wall
    light: night, a single bare bulb
    mood: loneliness, a threat behind your back
    variants:
      living:
        replace: true
        desc: >-
          a modest living room in a Mexican house: an old sofa, a wooden table, a small TV on a stand, a window
          showing the dark mountain
        light: night, a single warm lamp
      kitchen:
        replace: true
        desc: a small kitchen in a modest Mexican house, a glass of water on the table
        light: night, dim light from the hallway
  archivo:
    base: >-
      a municipal archive and newspaper library in an old colonial building: tall wooden shelves of bound newspaper
      volumes, a long wooden reading table
    light: day, dust floating in beams of daylight from high windows
    mood: silence, discovery
  cafe:
    base: a small café on a colonial town plaza, large windows facing the plaza, wooden tables, a counter with an espresso machine (no logos)
    light: warm daylight
    mood: ordinary day about to break
    variants:
      glass: every window has just exploded inward and thousands of glass shards hang motionless in mid-air, sparkling
  cuarto_diego:
    base: the bedroom of a 19-year-old, posters with no readable text, an unmade bed, a laptop on a desk, a low plaster ceiling with a ceiling lamp
    light: night, cold blue light from the laptop screen
    mood: alone with something on the screen
  presidencia:
    base: >-
      a mayor's office in an old colonial municipal building: dark wooden desk, tall shuttered windows, warm desk lamp,
      old framed photographs on the wall including one large framed group photo of mine workers
    light: day, warm lamps
    mood: power and polish
    variants:
      police:
        replace: true
        desc: a small-town police station office, an old desk with paper files, a two-way radio, a corkboard with photos and no readable text
        light: cold fluorescent light
        mood: tired routine
  panteon:
    base: >-
      a Mexican village cemetery during Día de Muertos: hundreds of candles, graves covered with bright orange
      cempasúchil marigold petals and garlands, papel picado without readable text, seven simple wooden coffins in a row
      covered in marigolds
    light: night, warm candlelight against deep blue night
    mood: luminous grief
