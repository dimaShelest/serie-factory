# Англійський шар біблії LA GARGANTA — те, що потрапляє в промпти (image / video / voice).
# Зона A. id ті самі, що в bible.yaml; кількість ознак ДНК — та сама, що в bible.yaml (перевіряє tests/test_prompts.py).
# Змінюєш тут → перегенеруй пакет (`uv run fabrica prompts la-garganta <набір>`): версія промпту зміниться.
#
# v2 (DESIGN §6, docs/research/2026-10-07-generators.md §2, §4, §7.2). Старі ключі (style.photo / footage /
# era_1994 / portrait, rules, negative, uniform_1994, wet_ghost) ще читає поточний компілятор — не видаляти до
# переходу на v2. style.video — уже v2-текст (v1-шаблон відео читає той самий ключ).
#   style.image / image_footage — Nano Banana (фото-стиль, кадр VHS / телефона); style.video / video_footage —
#   Seedance (без «photorealistic», дефекти камери словами); style.low_light — чиста темрява (image / video).
#   image_rules — сталі позитивні правила кадру; video_constants — сталі речення в кінці відео-промпту (whitelist лінту).
#   states — стани людини (кров з носа, мокрий, пил …): image — опис у кадрі, video — рядок «стан лишається».
#   characters / members / supporting: who — єдина доросла фраза для зображень і голосу («an adult …, 19»; окремого
#   adult немає); tag — хто це у відео (роль + 2 найпомітніші ознаки, без віку й імен, унікальний);
#   voice_design — опис голосу у форматі ElevenLabs (дорослий вік; Persona — 2–5 слів).
#   Вік у who — 19 для всіх молодих (запас від межі 18, §7.2); канонічний вік — у bible.yaml.
#   members: look — обличчя, волосся, прикраси й фірмова річ (без виразу, без «школи», без посилань на референс —
#   «Image 1 …» пише компілятор); mood — вираз для портрета 1994; wardrobe — решта одягу 1994 (білий + темно-синій,
#   без шкільної форми); wet — мокрий привид (дорослий, сумний, без гору й без слова про смерть; світло дає сцена).
#   locations: time (night | day | dawn | dusk) і framing плити; variants — {desc, replace, ref, framing, time,
#   light, mood}: replace false = той самий кадр місця (база + стан, ref — плита), replace true = окремий кадр
#   (опис самодостатній; ref — батьківська плита для узгодженості або null).

style:
  # ---- старі (компілятор v1)
  photo: >-
    Photorealistic cinematic still, shot on 35mm film, natural skin texture with visible pores, soft directional key
    light, muted desaturated palette with deep teal shadows and warm practical highlights, shallow depth of field,
    Mexican gothic horror film aesthetic.
  portrait: >-
    Head-and-shoulders portrait, front-facing, eyes to camera, neutral dark grey studio background, soft even light.
  sheet_background: plain light-grey seamless studio backdrop, soft even key light from camera left with gentle fill
  era_1994: >-
    Candid 35mm film snapshot from 1994, visible film grain, warm faded colors, slight on-camera flash look.
  footage:
    vhs: 1994 VHS camcorder footage, handheld, low resolution, slight video noise, no on-screen text or date stamp.
    phone: >-
      Smartphone video, handheld, slight digital noise, realistic phone footage, a clean frame with no on-screen
      interface, no recording icon and no timestamp.
  original: An original fictional character, not resembling any real person.
  # ---- v2
  image: >-
    Photorealistic 35mm film still from a slow-burn Mexican horror feature film: true-to-life skin, textures and
    materials, muted desaturated palette with deep teal shadows and warm practical
    highlights, gentle shallow depth of field, clean low-noise image.
  image_footage:
    # Кадр чіткий: старіння (зерно, розмиття) — один раз у монтажі (§3 #15, §4.5.5).
    vhs: >-
      A single frame from a 1994 home-video camcorder recording: handheld framing slightly off-level, harsh on-camera
      light, soft early-1990s colors; a clean, sharp image with no date stamp and no overlays.
    phone: >-
      A single frame from a smartphone video: handheld framing, phone-camera wide lens, natural available light; a
      clean image with no interface, no recording icon and no timestamp.
  # v1 і v2 читають цей ключ; «photorealistic» у Seedance заборонено (лінт banned_video).
  video: >-
    Live-action horror film look, natural motion, natural skin texture, muted desaturated palette with deep teal
    shadows and warm practical highlights.
  video_footage:
    vhs: >-
      Handheld home-video camcorder look: moderate shake, imperfect framing, autofocus hunting, small exposure shifts;
      no stabilization, no gimbal.
    phone: "Handheld smartphone video look, natural phone-camera motion; no stabilization."
  low_light:
    image: >-
      Dim but readable exposure: the subjects are caught by the motivated light and the shadows still hold detail;
      clean low-noise image.
    video: Clean low-noise image; dark areas stay clean without colour noise.

# Правила під Seedance / Nano Banana — додаються в кожен промпт кадру (v1).
rules:
  - no text, letters, numbers, signs or logos anywhere in the frame
  - hands are never in close-up and stay natural with five fingers
  - no fights, no crowds in motion
  - no gore, no wounds, no blood except a thin trickle from the nose
  - every person is an adult (18+)

# v1: жоден API негатив не приймає (Seedance, Nano Banana) — v2 негатив не шле. «child, minor» прибрано (§7.2: такі
# токени лише чіпляють фільтр); «flicker» і «camera shake» прибрано — їх просять самі шоти (лампа, поштовх).
negative:
  common: [text, letters, numbers, subtitles, watermark, logo, signage, extra fingers, deformed hands, hand close-up,
           gore, wounds, blood pool, cartoon, anime, 3d render, plastic skin, oversaturated colors]
  video: [morphing, temporal instability, jitter, face distortion, sudden scene change]

# v2: позитивні правила кадру для Nano Banana (негативного поля немає). Формулювання з «no …» — у whitelist лінту.
image_rules:
  - a clean frame with unmarked walls and surfaces, no lettering, signs or logos anywhere
  - every object is plain and unbranded
  - people's hands relaxed at medium distance, natural, five fingers
  - every person is an adult
  - only the people described appear in the frame
  - a single full-bleed photograph, no panels, borders or captions

# v2: сталі речення в кінці кожного відео-промпту (компілятор додає; лінт їх пропускає).
video_constants:
  - No subtitles, no on-screen text.

# v2: стани людини для scene / shot `state`. image — у стартовий кадр; video — рядок у LOCK, що стан лишається.
states:
  nosebleed:
    image: a thin dark-red line of blood running from the left nostril down to the upper lip
    video: the thin line of blood under the nose stays
  nosebleed_wiped:
    image: a faint smear of wiped dark-red blood above the upper lip
    video: the faint smear of blood above the lip stays
  wet:
    image: >-
      soaked from head to toe: hair plastered and dripping, clothes dark and heavy with water, skin pale with a
      grey-blue tint, fine grey mine dust on the face, normal human eyes, a quiet sorrowful expression with the mouth
      closed
    video: hair and clothes stay soaked and dripping
  dusty:
    image: a fine layer of pale grey rock dust on the hair, face and clothes
    video: the grey dust on hair and clothes stays
  exhausted:
    image: a pale, drained face with dark shadows under the eyes and heavy eyelids
    video: the face stays pale and drained, the shoulders low
  sweaty:
    image: small beads of sweat on the temples and forehead
    video: the beads of sweat on the temples stay
  wet_shoulder:
    image: a dark wet patch on the right shoulder of the shirt
    video: the dark wet patch on the right shoulder stays

