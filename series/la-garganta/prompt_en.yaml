      - round thin metal-frame glasses
      - long dark hair in a single braid over her right shoulder
      - a burgundy knitted cardigan
      - a canvas tote bag strap across her chest
    # «long skirt or jeans» давало різний одяг у різних кадрах — обрано одне.
    wardrobe: burgundy knitted cardigan over a white collared blouse, a long dark skirt, flat ankle boots
    expression: focused, analytical, slightly skeptical, light brown skin
    emotions:
      - "deep concentration, eyes lowered as if reading"
      - "shock, eyes wide, lips parted"
      - "quiet sorrow, eyes wet"
    voice: clear, even, measured young female voice that speeds up with excitement; Mexican Spanish accent
    voice_design: >-
      Native Spanish (Mexico City), central Mexican accent with no Castilian features. Female, early 20s. Perfect
