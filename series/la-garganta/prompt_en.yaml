    preview_es: "Esto no es una coincidencia. Siete nombres, una sola noche, y la misma hora en todos los relojes del pueblo. Alguien sabe qué pasó."
  mateo:
    who: an adult Mexican man, 19, with the grown features of a man in his early twenties
    tag: the pale man in the open blue-grey plaid flannel shirt
