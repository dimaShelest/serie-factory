# Послідовності для студії й пакета промптів (`fabrica prompts la-garganta 1 --sequence first30`).
# Послідовність = шоти однієї частини; пакет бере їхні кадри, кліпи й репліки та все з кастингу, без чого їх не
# зробити (обличчя → ракурси → локації → голоси), у порядку виробництва (prompts.sequence_items).
# id шотів — у лапках («1.10» без лапок YAML прочитає як число 1.1).

first30:
  title: "Перші 30 с — біт 1, VHS 1994"
  part: 1
  shots: ["1.01", "1.02", "1.03", "1.04", "1.05", "1.06", "1.07", "1.08"]
  notes: "HOOK_OPEN: сімка 1994 у шахті, VHS; скрімер Beto (1.07); 1.08 — VHS-шум у монтажі"
