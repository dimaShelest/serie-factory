# Біблія «LA GARGANTA» — зона Claude A (series/).
# Опис — українською; діалоги й репліки — іспанською (мексиканською).
# Фабрика читає цей файл на етапах script / shots / refs / voice. id — латиницею, без пробілів.
# Джерело: текст сюжету від dimaShelest (2026-10-05). «Пропозиція A» = додав Claude A, людина ще не затвердила.

version: 1
slug: la-garganta
title: "LA GARGANTA"
status: draft                    # draft → approved (людина затвердила)
genre: [хорор, детектив, надздібності]
tradition: ["El Orfanato", "El espinazo del diablo"]   # орієнтир тону: містика + людське зло
logline: >-
  Четверо випускників виходять зі старої шахти зі здатністю піднімати предмети думкою. Щоразу, коли
  вони користуються силою, міський годинник зупиняється на 3:17, а когось із колишніх шахтарів
  знаходять мертвим.
core_twist:                      # розкривається в частині 4 — до того НЕ підказувати прямо
  mystic: >-
    Містика справжня: сила належить сімом загиблим у 1994 році. Вони «позичили» її живим, щоб ті
    підняли камінь і винесли правду.
  human: >-
    Вбивства — людські. Шахтарів убиває Don Arturo Saldívar. У 1994 він наказав підірвати вихід,
    знаючи, що молодь усередині: ховав нелегальний нічний видобуток. Тепер прибирає свідків і маскує
    вбивства під містику.

# ---------------------------------------------------------------- формат
format:
  parts: 4
  part_minutes: [6, 8]
  release_cadence: 2 частини на тиждень
  part_video: {aspect: "16:9", platform: YouTube}
  teaser_video:
    aspect: "9:16"
    seconds: [30, 40]
    platforms: [TikTok, YouTube Shorts]
    span: TEASER{n}_START → TEASER{n}_CUT_BEFORE
    rule: вау-кадр + обрив ДО скрімера; сам скрімер — лише на YouTube
  film:
    title_es: "LA GARGANTA — Película completa"
    minutes: [25, 30]
    after_part: 4
    excludes: [recaps, end_cards]   # «Anteriormente en LA GARGANTA…», «Continuará…»
  release_note: >-
    Пропозиція A: фінал (частина 4, Día de Muertos) і фільм випустити 31 жовтня – 2 листопада.

# ---------------------------------------------------------------- місце дії
setting:
  country: Мексика
  accent: м'який мексиканський, мінімум сленгу
  town: San Isidro de la Sierra      # вигадане гірське містечко
  town_look: >-
    Колоніальне шахтарське містечко в горах (у дусі Сакатекаса / Гуанахуато): бруківка, кольорові
    фасади, парафіяльна церква, площа з вежею годинника. Над містом — гора з закритою шахтою.
  mine: La Garganta                  # закрита срібна шахта над містом
  era: 2026                          # сучасність; флешбек 1994 — лише як VHS-запис
  year_1994: >-
    Під обвалом зникли 7 випускників prepa (18 років), які потай залізли в шахту на прощальну
    вечірку. Тіла не знайшли. Усі годинники міста зупинились о 3:17.

language:
  dialogue: природна мексиканська іспанська, звертання на «ustedes»
  avoid: [vosotros, coger, "vale (як «окей»)", tío, guay, móvil, ordenador, "güey (пропозиція A — мінімум сленгу)"]
  allowed_sparingly: ["no manches (лише Diego)", "mija (Saldívar до Renata)", chavos]
  note_name_vale: >-
    Ім'я «Vale» в іспанській збігається з «vale» («окей»). У напружених звертаннях — «Valeria»,
    щоб репліка не читалась як «окей».
  time_spoken: «las tres diecisiete»   # 3:17 кажемо словами, не показуємо текстом

# ---------------------------------------------------------------- правила світу
rules:
  telekinesis:
    - Сила — сімох загиблих 1994 року, «позичена» живим. Ніхто не знає цього до частини 4.
    - Кожне використання сили → міський годинник (і годинники поруч) зупиняється на 3:17.
    - "Ціна: кров з носа (сильніша дія — сильніша кровотеча) і виснаження."
    - Сила спалахує від емоцій, найсильніше у Vale. Вибухи скла, левітація дрібниць — некеровані.
    - Четверо разом сильніші за суму: лише разом піднімають завал (частина 4).
    - "Пропозиція A: підлітки піднімають предмети, але не людей. Людей (Diego на стелі) піднімає лише сила сімох."
    - "Як виглядає: предмети зависають з повільним обертанням; першими реагують пил, камінці, вода;
      повітря ледь дрижить; низький гул. Без світла з рук і без крупних планів рук — силу видно по предметах."
  los_siete:
    - Семеро — мокрі (затоплений тунель), звідси мокрі сліди й краплі ЗСЕРЕДИНИ дзеркала.
    - З'являються у відображеннях і на записах (силуети), у формі prepa 90-х.
    - Не нападають — показують правду, але лякають.
  mateo_is_tomas:                  # правила консистентності — порушення ламає твіст
    - Mateo ніколи не їсть і не п'є (відмовляється, тарілка стоїть недоторкана).
    - На фото й відео Diego обличчя Mateo розмите (у генерації — розмиття в монтажі або motion blur).
    - Mateo не відображається у воді й дзеркалах. До CLIFF частини 3 — жодного кадру з Mateo і відображенням.
    - Волосся Mateo завжди трохи вологе (тиха підказка).
  murders:
    - Вбивства людські — Saldívar прибирає свідків нічної зміни 1994 року.
    - Він вбиває в ночі, коли зупиняється годинник, щоб місто вірило в прокляття.
    - Усе насильство — за кадром. Показуємо лише наслідки (кімната, сліди, реакції), тіл у кадрі немає.
  clock:
    - 3:17 — час вибуху 1994 року. Годинник на вежі площі видно з усього міста.
    - У кадрі — стрілки на 3:17 (аналоговий циферблат), без цифрових написів.
  visual_seedance:
    - Вау — це фізика сили: уламки, каміння, вода, пил, левітація. Ніч, ліхтарі, темрява шахти.
    - Found footage (телефон Diego, VHS 1994) — для реалізму і скрімерів.
    - "Без: бійок, натовпів у русі, крупних планів рук, тексту в кадрі."
    - "Текст (газета, список імен, «Continuará…», назва) не генеруємо: документи читаємо вголос або
      показуємо під кутом/розмито, написи накладаємо в монтажі (assemble)."
    - "Тизер TikTok = вау-кадр + обрив ДО скрімера. Скрімер — лише на YouTube."

