# ---------------------------------------------------------------- табу
taboos:
  - Усі герої повнолітні (18+). Неповнолітніх у кадрі немає.
  - Насильство — за кадром. Тіл, крові ран, зброї в дії в кадрі немає. Кров з носа — так.
  - Без насильства над дітьми й тваринами.
  - Без реальних людей, реальних компаній і реальних міст (місто й шахта вигадані).
  - Без бійок, натовпів у русі, крупних планів рук, тексту в кадрі (див. rules.visual_seedance).
  - Без сексуального контенту.
  - Día de Muertos — з повагою до традиції, без карикатур.

