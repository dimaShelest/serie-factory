      Ключові підказки — документи (стаття, список, вирвана сторінка), а відеомодель погано генерує текст.
    decision: Імена й дати читаємо вголос; папір — під кутом або розмито; написи — накладаємо в монтажі.
  - id: hands-vs-ring
    note: Перстень Saldívar — підказка, але крупні плани рук заборонені.
    decision: "Перстень на столі (частина 1) — крупно, бо це предмет. На руці (частина 3) — середній план, камінь ловить світло."
  - id: mateo-photo-consistency
    note: Обличчя Mateo має збігатися з Tomás на фото 1994, але подряпане фото (частина 3) його ховає.
    decision: Один ref обличчя для Mateo і Tomás; фото 1994 — той самий ref у стилізації 90-х.
