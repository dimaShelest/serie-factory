# Англійські описи шотів ч.1 «El Reto» для промптів (стартовий кадр + відео). Зона A.
# Ключ — id шоту з part1_shotlist.md. Поля: composition (стартовий кадр), action (рух у відео), camera, light,
# variant (стан локації з prompt_en.yaml), people (перевизначити, кого описувати; {id, state: wet}), framing.
# ♻ і монтаж тут не потрібні. Змінюєш опис → перегенеруй пакет: хеш промпту зміниться, golden зніметься.

"1.01":
  people: []
  composition: >-
    Night, 1994, seen through a camcorder: the dark mine entrance; seven young adults (1994 high-school graduates,
    faces not visible) with flashlights squeeze through the rusty gate one by one.
  action: >-
    Flashlight beams bob as the silhouettes slip into the mine one by one; the one in front hushes the others with a
    raised finger; the camera follows, shaking.
  camera: handheld VHS camcorder, following
"1.02":
  variant: tunnel
  people: [lupita, monica, ivan]
  composition: >-
    Inside the narrow mine tunnel, 1994: three graduates laugh into the camcorder light holding glass soda bottles;
    another boy stands with his back to the camera, face never visible.
  action: >-
    They laugh and shove each other playfully, flashlight beams sweeping the wet walls; the curly-haired girl shouts
    at the camera operator.
  camera: handheld VHS camcorder at chest height
"1.03":
  variant: tunnel
  people: [rosa_elena, beto]
  composition: >-
    The camcorder pans across faces lit by flashlights in the tunnel; in the background a boy in a blue-grey plaid
    flannel shirt is out of focus, his face never sharp; a mine radio hangs on a timber beam.
  action: >-
    Slow pan from face to face; the radio hisses with static; the out-of-focus boy turns away from the lens.
  camera: handheld VHS camcorder, slow pan
"1.04":
  variant: tunnel
  people: []
  composition: >-
    Seven young adults in 1994 school uniforms stand in the narrow tunnel, frozen mid-laugh, looking up; fine dust
    trickles from the ceiling in the flashlight beams.
  action: A deep rumble from the mountain; dust pours from the ceiling; the laughter stops and every head turns upward.
  camera: handheld VHS camcorder, slight shake
"1.05":
  variant: tunnel
  people: []
  composition: Darkness of the tunnel crossed by wildly swinging flashlight beams; nobody clearly visible.
  action: >-
    Flashlight beams swing in panic across the rock; the image glitches with VHS tracking noise; a voice calls a name
    off-screen.
  camera: handheld VHS camcorder, jerky
"1.06":
  variant: tunnel
  people: []
  composition: Pitch-black tunnel; a single flashlight beam on wet rock and old timber supports; dust in the beam; nobody in the frame.
  action: >-
    The beam slowly searches the tunnel, trembling with the operator's breathing; silence; it stops on a dark bend.
  camera: handheld VHS camcorder, slow searching pan
"1.07":
  variant: tunnel
  people: [{id: beto, state: wet}]
  framing: Extreme close-up
  composition: In the flashlight beam a soaked pale young man's face with mine dust is right in front of the lens, eyes wide open.
  action: The face is suddenly there in the beam, completely still, water dripping; the camcorder jolts back.
  camera: handheld VHS camcorder, a sharp jolt backwards
"3.01":
