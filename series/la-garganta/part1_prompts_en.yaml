# Англійські описи шотів ч.1 «El Reto» — режисерська схема (оверлей v2). Зона A.
# Формат — fabrica/shotspec.py (SceneIn / ShotIn / ClipIn); правила — docs/research/2026-10-07-generators.md.
# Профіль генерації manual-5s: кліпи по 5 с; довгі шоти — clips:, наступний кліп стартує з останнього кадру.
# Змінюєш опис → перегенеруй пакет: хеш промпту зміниться, golden зніметься.

# ===== c12 =====
# LA GARGANTA · ч.1 «El Reto» · оверлей v2, сцени 1–2 (шоти 1.01–1.08, 2.01) — перші 30 с (HOOK_OPEN, VHS 1994).
#
# Режисура сцени 1 (план підлоги, одна вісь для всіх шотів):
#   камера = камкордер Chuy (оператор, НІКОЛИ в кадрі; у звуку — його дихання). Камера стоїть між входом і групою
#   й дивиться ВГЛИБ тунелю; рейки біжать від низу кадру в глибину до темного повороту. Група — між камерою й
#   глибиною, обличчями до об'єктива. Tomás — завжди найглибше, СПИНОЮ до об'єктива, дивиться в темряву тунелю
#   (у 1.01 він перший пролазить у ворота; у 1.04 поза кадром). Обличчя Tomás = референс Mateo, тому Tomás НЕ в
#   people: без референсу обличчя взагалі, лише текст однаковими словами («a man with short dark hair parted in the
#   middle, in an open blue-grey plaid flannel …») і завжди спиною; у відео — «the man in the plaid flannel keeps his
#   back to the lens» у кінцевому стані. Так ще й −215 знаків тегів у кожному промпті Seedance (ліміт 2000).
#   Світло: маленька лампа на камкордері — жорстке біле світло вздовж об'єктива (style vhs «harsh on-camera light»);
#   ліхтарі в руках — однакові темні металеві, теплий жовтий промінь. Після обвалу (1.05) лишається тільки лампа
#   камкордера: 1.06 і 1.07 — одне коло білого світла.
#   Хто де: 1.01 — Iván, Tomás, Mónica спиною + два промені всередині + Lupita хихоче за кадром = шестеро (+ Chuy за
#   камерою = сімка). 1.02 — Iván / Lupita / Mónica + Tomás спиною. 1.03 — Rosa Elena / Beto + Tomás спиною в розфокусі +
#   рація (C07). 1.04 — Lupita / Mónica / Beto (Iván, Rosa Elena, Tomás — поза кадром; ≤ 3 людей у діалозі).
#   Кліпи профілю manual-5s: шот 6 с = кліп 1 (увесь, 5 с) + перша 1 с кліпу 2 (shotspec.clips) — головне в кліпі 1.
#   Дія / камера шоту з кліпами = кліп 1 (якорі YAML); end_state шоту = кінець останнього кліпу.
#   Відео-тексти короткі: компілятор додає стиль VHS, розстановку, репліку, замок — промпт Seedance ≤ 2000 знаків.
# ===== c3 =====
# Оверлей v2 · ч.1 «El Reto» · сцена 3 (шоти 3.01–3.13): четверо біля входу в шахту вночі, спір Mateo, тунель.
# frame — статична перша мить (Nano Banana, імена → референси); action / end_state / clips — рух для Seedance (люди —
# лише тегами з prompt_en.yaml, без віку); camera — один рух із ціллю й кінцевою точкою; звук — без музики.
# Блокінг входу: шлях піднімається зліва знизу до входу справа вгорі; Mateo біля входу (праворуч, дивиться ліворуч),
# троє приходять зліва (дивляться праворуч); камера — з боку схилу (вогні міста позаду); місяць — зліва згори.
# Тунель: камера позаду групи; порядок у колоні — Mateo, Vale, Sofía, Diego (знімає телефоном, його світло — телефон).
# На записах Diego: 3.04 — Mateo view blurred (без референсу обличчя, розмиття рухом, C03); 3.08 — Mateo зі спини
# (view back, обличчя не видно), без «привидного» розмиття всієї фігури (bible: mateo_is_tomas).
# Підлога тунелю суха й матова в кожному шоті з Mateo: він не відображається (bible: mateo_is_tomas).
# ===== c45 =====
# Оверлей v2 · ч.1 «El Reto» · сцени 4–5 (шоти 4.01–4.09, 5.01–5.12): світанок після обвалу (камінці в повітрі, кров
# з носа — у трьох; Mateo без крові, але непомітно витирає чистий ніс, як інші: тиха підказка 4.06, +C15), денний
# монтаж сили й відео Diego, нічна вулиця й площа.
# frame — статична перша мить (Nano Banana; імена → референси); action / end_state / clips — рух для Seedance (люди —
# лише тегами з prompt_en.yaml, без віку); camera — один рух із ціллю й кінцевою точкою; звук — без музики.
#
# Сцена 4 · блокінг: камера з боку схилу, дивиться на вхід шахти (дерев'яна рама — праворуч у глибині); сонце сходить
# зліва за далеким хребтом (низьке золоте світло зліва, туман понизу). На рівному майданчику перед входом: Vale —
# ліворуч від центру (на спині), Sofía — в центрі (на боці, спиною до камери), Diego — праворуч від центру (сидить,
# спершись на руки), Mateo — окремо, на пласкому камені біля рами входу справа, у профіль, дивиться на гору.
# Камінці висять над трьома з 4.02 до 4.08 (падають від крику Vale 4.07); у 4.01 їх здалеку не видно.
# Стан сцени 4: Vale, Diego — кров з носа (nosebleed). Sofía — без стану: у 4.03 / 4.08 / 4.09 спиною або здалеку
# (кров не видно, а кожен стан — +~110 символів відео-промпту, ліміт 2000); у 4.04 кров — текстом кадру, бо вона її
# витирає. Mateo — без крові: у 4.06 він непомітно витирає ЧИСТИЙ ніс, повторюючи жест інших, щоб не виділятися
# (рішення dimaShelest 2026-10-07, +C15); стану dusty немає ні в кого: друга підказка зайва.
# 4.09 продовжує 4.08 (handoff continue): той самий сетап, вікно 4.08 закінчується на 5,0 с.
#
# Сцена 5 · вітальня вдень (casa_vale.living_day): диван під правою стіною, вікно на задній стіні ліворуч (денне світло
# зліва), посередині вільна підлога; ТБ (темний екран відбиває) — поза кадром, коли в кадрі Mateo (bible: не
# відображається). Кухня вдень (kitchen_day) — 5.03–5.04. Ніч: вулиця (street) → площа.
# Площа (5.10–5.12 → 6.01): авто (variant sedan) ліворуч від Diego; Diego дивиться ліворуч на авто, говорить праворуч до
# трьох; Vale праворуч дивиться ліворуч на Diego. Годинник на вежі цокає — звуковий мотив до зупинки на 3:17 у 6.04.
# ===== c67 =====
# Оверлей v2 · ч.1 «El Reto» · сцени 6–7 (шоти 6.01–6.08, 7.01–7.17): площа о 3:17 (авто піднімається й падає,
# годинник), дім шахтаря (меблі на стелі), Renata і напарник.
# frame — статична перша мить (Nano Banana; імена → референси; напарник — лише текстом із supporting); action / end_state
# / clips — рух для Seedance (люди лише тегами з prompt_en.yaml, без віку); camera — один рух із ціллю й кінцевою
# точкою; звук — конкретні звуки, без музики. Профіль manual-5s: шот > 5 с → clips (кліп 2 стартує з останнього кадру
# кліпу 1); дія / камера шоту з кліпами = кліп 1 (якорі YAML), end_state шоту = кінець останнього кліпу.
#
# Сцена 6 · площа вночі, вісь та сама, що в 5.11–5.12 (сцени 4–5): авто стоїть ПЕРЕД вежею з годинником, ліворуч від
# Diego; троє друзів — праворуч позаду Diego (поза кадром у 6.01), Vale знімає з їхнього боку (6.02). Diego дивиться
# ліворуч на авто. Стан авто — лише через variant: sedan (стоїть, 6.01 старт) → sedan_lifted (висить 2 м: 6.02, 6.03,
# 6.05 старт) → sedan_crashed (6.07). Годинник: у 6.01–6.02 обидві стрілки біля «3» (≈ 3:15, далеко); 6.04 — clock_317,
# 6.06 — clock_shop (стрілки 3:17 описані словами, без цифр). Звуковий мотив: цокання вежі (5.10–5.12, 6.01–6.03)
# обривається глухим ударом у 6.04 — далі тиша. Кров з носа Diego починається в 6.03 → у 6.07 стан nosebleed.
#
# Сцена 7 · дім шахтаря (одна кімната): двері — південна стіна, ліжко (його світлий прямокутник) — навпроти дверей,
# тумбочка поруч із ліжком, стіл зі стільцями — західна стіна, мале вікно — східна (крізь нього червоно-сині вогні).
# Сліди мокрих босих ніг — від дверей до прямокутника ліжка. До розкриття (7.02) і на рівні підлоги (7.04, 7.07, 7.09,
# 7.10, 7.13, 7.14) — variant room_before (стеля поза кадром, підлога вже порожня); стеля в кадрі — variant ceiling
# (7.03, 7.05, 7.08, 7.11, 7.12). Тіла в кадрі немає ніколи (7.07 — дивиться за нижній край кадру). З 7.05 у Renata
# мокра пляма на правому плечі (крапля з ліжка) → стан wet_shoulder у всіх наступних її шотах; з 7.05 вона в кадрі
# повернута праворуч (профіль / 3/4 обличчям праворуч), щоб праве плече було до камери. Напарник —
# policia_companero (supporting: одна фіксована зовнішність текстом), завжди спиною. Обличчя: Renata анфас / 3/4 лише
# там, де потрібно (7.02 вхід, 7.07 і 7.10 репліки, 7.09 медальйон); розкриття й події (7.03, 7.05, 7.11, 7.13, 7.15) —
# профіль, щоб стартовий кадр тримався точно (маршрут без обличчя).
# ===== c89 =====
# LA GARGANTA · ч.1 «El Reto» · оверлей v2, сцени 8–9 (шоти 8.01–8.18, 9.01) — CLIFF: Vale сама вдома, дзеркало.
#
# Режисура сцени 8 (план підлоги):
#   Вітальня (casa_vale.living): вхідні двері — в глибині; дерев'яний стіл — між дверима й камерою 8.01 (Vale іде
#   до нього на камеру й лишається в центрі); диван і малий ТБ — праворуч; вікно на гору — у задній стіні ліворуч.
#   8.01 — лампи вимкнені (лише місячне світло з вікна); 8.03–8.04 — увімкнена одна тепла лампа; 8.06–8.07 — лампа
#   знову вимкнена, світить лише екран ТБ.
#   Кухня (kitchen) — лише вставка 8.02 (тінь Vale проходить, вода в склянці тремтить).
#   Спальня Vale (базова плита casa_vale; рішення dimaShelest 2026-10-07: ліжко й дзеркало — одна кімната): дзеркало
#   над маленьким білим умивальником — на «північній» стіні; вузьке ліжко — під «західною» (ліворуч, якщо стояти
#   обличчям до дзеркала); двері — позаду праворуч. Світло — одна гола лампочка на короткому шнурі під стелею.
#   8.05 — сидить на краю ліжка (база); 8.08 — вмивається над умивальником під дзеркалом; 8.09–8.16 — дзеркало.
#   Vale стоїть обличчям до дзеркала. Дві позиції камери, обидві по один бік осі Vale ↔ дзеркало:
#     A «у дзеркало» (8.09, 8.11, 8.13, 8.15): камера одразу за ЛІВИМ плечем Vale, дивиться прямо в дзеркало;
#       дзеркало займає майже весь кадр, реальне — лише розмитий край її плеча й хвоста внизу ліворуч. Відчинені
#       двері спальні у відображенні — праворуч від її відображення. Beto (мокрий) — ЛИШЕ у відображенні:
#       8.11 у темному дверному отворі (силует, розфокус → перевід фокуса), 8.13 — за крок від її правого плеча
#       (верх обличчя в тіні), 8.15 — просто за її правим плечем (обличчя повністю — лише тут). Реальна кімната перед
#       дзеркалом поза кадром — там нікого.
#     B «з боку дзеркала» (8.12 крупний, 8.14 середньо-загальний): камера там, де дзеркало, дивиться на Vale; двері —
#       в глибині ліворуч у кадрі (її праворуч), темні й порожні; ліжко — праворуч у кадрі; у 8.14 на плитці підлоги —
#       мокрі сліди від дверей до маленької калюжі за крок позаду неї, там, де в 8.13 стояв Beto (C02 — мокрі сліди,
#       як у 7.04).
#   Кров з носа (одна тонка цівка, без ран): 8.05 — з'являється й витирається (кінець — слід над губою); 8.08 —
#   знову тонка лінія, у воді блідо-рожевий відтінок; 8.09 — витирає, лінія з'являється знову (кров лише в тексті
#   кадру, без state, бо LOCK «кров лишається» суперечив би витиранню); 8.11–8.15 — лишається.
#   Обличчя у відображенні = обличчя в кадрі → у шотах A face: clear (маршрут з обличчям), хоча Vale спиною.
#   Мокрий Beto: {id: beto, state: [wet]} → референс beto.wet (wet-текст стану компілятор не дублює).
#   Кліпи профілю manual-5s: 8.03–8.05 — по 5 с, один кліп (рішення 2026-10-07); 8 с = 5 + 3; 10 с = 5 + 5.
#   Дія / камера шоту з кліпами = кліп 1 (якорі YAML); end_state шоту = кінець останнього кліпу.
#   Відео-тексти: люди лише тегами, без віку, без заперечень, без «flicker / glow / fast»; звук — без музики.

version: 2

scenes:
  "1":
    time: night
    variant: tunnel
    light: hard white camcorder light on the nearest faces; warm yellow flashlight beams
    continuity:
      - fine grey dust floats in every beam of light
      - outside the light the rock stays very dark but readable
    sound:
      ambience:
        - the low hum of the mountain
        - slow water drips

  "3":
    time: night
    sound:
      ambience:
        - cold wind over the rocks
        - crickets far below
        - a faint low hum from inside the mountain

  "4":
    time: dawn
    variant: dawn
    light: >-
      dawn: low golden sunrise light from the left through thin low mist, long soft shadows, cool blue shade in the
      hollows between the rocks
    state:                     # кров з носа в трьох; у Mateo — ні (C15: він лише витирає чистий ніс, 4.06)
      vale: [nosebleed]
      sofia: [nosebleed]
      diego: [nosebleed]
    continuity:
      - thin low mist lies over the rocky ground in front of the mine entrance
    sound:
      ambience:
        - a cold dawn breeze moving over the rocks
        - a few birds waking far down the slope
        - a faint low hum hanging in the air
  "5":
    sound:
      ambience:
        - "a quiet house by day: faint street sounds through the window, a dog barking far away now and then"

  "6":
    time: night
    sound:
      ambience:
        - "a quiet night plaza: a faint breeze, a dog barking far away"

  "7":
    time: night
    variant: room_before
    sound:
      ambience:
        - a heavy hush inside the small adobe room
        - a police radio crackles faintly outside
        - crickets outside

  "8":
    time: night
    sound:
      ambience:
        - crickets chirp faintly outside
        - a refrigerator hums softly somewhere in the house

shots:
  "1.01":
    beat: establish
    variant: null
    light: >-
      night, cold moonlight on the rocks; warm yellow flashlight beams point into the black tunnel mouth; the
      camcorder's small lamp lights the nearest backs
    people:
      - {id: ivan, view: back, facing: the gate}
      - {id: monica, view: back, facing: the gate}
    frame: >-
      Night on the rocky mountainside at the mine entrance, seen from a few steps behind three people at eye level. The
      black mouth of the mine is framed by old timber beams, rusted rails run into it, and a rusty iron gate stands half
      open across it. In the gap of the gate in the centre stands a man with short dark hair parted in the middle, in an
      open blue-grey plaid flannel over a white button-up shirt and dark trousers, with his back to the lens, one foot
      already inside, his flashlight beam pointing into the black tunnel. A few steps behind him, Iván on the left and
      Mónica on the right wait on the rails with their backs to the lens, their flashlights aimed at the gate. Deep
      inside the tunnel mouth two more warm flashlight beams move on the rock, the people holding them hidden behind
      the rock.
    action: >-
      The man in the plaid flannel ducks through the gap of the rusty gate into the black tunnel. The man in the denim
      jacket steps through after him; the woman with the black headband walks up to the gate. Their beams bob with
      every step.
    end_state: >-
      both men are inside the tunnel mouth, dark backs in their own beams, and the woman with the black headband stands
      in the gap with her back to the lens
    camera:
      size: wide
      move: follow
      speed: slow
      target: the three walking to the gate
      endpoint: the dark gap of the gate in the centre of the frame
      angle: eye level
      shake: moderate
    sound:
      ambience:
        - night wind over the rocks
      sfx:
        - boots crunch on gravel
        - the gate hinge creaks once
        - an unseen woman right beside the camera giggles; a man's sharp shh answers from deeper inside the dark tunnel
    continuity:
      - every flashlight is the same plain dark metal flashlight
    success:
      - "у кадрі троє спиною (джинсова куртка ліворуч, фланель у воротах, обідок праворуч) + два промені всередині"
      - "жодного обличчя до камери; оператора (Chuy) не видно; ніхто не обертається на сміх"
      - "на воротах, балках і скелі немає написів"
    notes:
      - "Сімка мінус оператор: троє спиною (Iván, Tomás — текстом, Mónica) + двоє всередині (промені, люди за скелею) + Lupita хихоче біля мікрофона = шестеро."
      - "Сміх — «невидима жінка біля камери»: інакше модель поверне голову Mónica до об'єктива (обличчя в кліпі без облич)."
      - "Без screen у people: камера йде слідом, Iván пролазить у ворота — замок «stays on the left» сперечався б із рухом."

  "1.02":
    beat: dialogue
    people:
      - {id: ivan, view: three_quarter, screen: left}
      - {id: lupita, view: face, screen: center}
      - {id: monica, view: three_quarter, screen: right}
    frame: >-
      Inside the narrow mine tunnel, seen at eye level from the camcorder. Lupita stands in the centre about two metres
      from the lens, laughing straight into the camcorder's white lamp, a plain straight-sided clear glass bottle of
      dark soda held at shoulder height. Iván on the left and Mónica on the right stand half a step behind her, both
      turned three-quarters toward the lens and laughing; Iván holds another plain straight-sided glass bottle, Mónica
      holds a plain dark metal flashlight pointed at the floor. Far back in the tunnel on the right, at the edge of the
      light, stands a man with short dark hair parted in the middle, in an open blue-grey plaid flannel over a white
      button-up shirt and dark trousers, alone with his back to the lens, his flashlight beam pointing into the dark
      depth of the tunnel. The rusted rails run past them into the darkness.
    action: >-
      [0s-4s] The woman with curly bangs leans toward the lens, lifts her bottle above her head and shouts her line;
      the other two grin with closed lips, shoulders shaking. [4s-6s] All three keep grinning with closed lips; the
