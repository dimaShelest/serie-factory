[project]
name = "serie-factory"
version = "0.1.0"
description = "Генератор іспаномовних AI-серіалів: серії для YouTube і тизери для TikTok/Shorts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.optional-dependencies]
claude = ["anthropic>=1.11.0"]           # переписувач студії через Claude: uv sync --extra claude; REWRITE_BACKEND=claude

[project.scripts]
fabrica = "fabrica.cli:main"         # uv run fabrica --help

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fabrica"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]          # `import fabrica` у тестах без встановлення пакета
